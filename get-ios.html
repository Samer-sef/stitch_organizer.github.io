<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Stitch Organizer</title>
<noscript><meta http-equiv="refresh" content="1;url=https://apps.apple.com/app/apple-store/id6787266532?pt=128787199&amp;ct=meta&amp;mt=8"></noscript>
<style>
  :root { --bg:#f7f1e8; --ink:#2b2420; --muted:#6b5f57; --red:#c8302c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1f1b18; --ink:#f3ece4; --muted:#b8aca2; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--ink); font:18px/1.5 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
         padding:24px 16px; text-align:center; }
  main { max-width:420px; }
  .icon { width:96px; height:96px; border-radius:22px; background:#fff; margin:0 auto 20px;
          box-shadow:0 2px 10px rgba(0,0,0,.12); display:flex; align-items:center; justify-content:center; }
  h1 { font:600 30px/1.2 Georgia, "Times New Roman", serif; margin:0 0 8px; }
  p { margin:0 0 28px; color:var(--muted); }
  a.btn { display:inline-block; background:var(--red); color:#fff; text-decoration:none; font-weight:600;
          font-size:20px; padding:16px 28px; border-radius:999px; }
  small { display:block; margin-top:18px; color:var(--muted); font-size:15px; }
</style>
</head>
<body>
<main>
  <div class="icon" aria-hidden="true">
    <svg width="60" height="60" viewBox="0 0 60 60"><g stroke="#c8302c" stroke-width="7" stroke-linecap="round"><line x1="12" y1="12" x2="48" y2="48"/><line x1="48" y1="12" x2="12" y2="48"/></g></svg>
  </div>
  <h1>Stitch Organizer</h1>
  <p>Your floss stash, your projects and your shopping list, together on your phone. Free.</p>
  <a class="btn" href="https://apps.apple.com/app/apple-store/id6787266532?pt=128787199&amp;ct=meta&amp;mt=8">Download on the App Store</a>
  <small>Opening the store...</small>
</main>
<script>
  setTimeout(function () { window.location.replace("https://apps.apple.com/app/apple-store/id6787266532?pt=128787199&ct=meta&mt=8"); }, 1000);
</script>
</body>
</html>
